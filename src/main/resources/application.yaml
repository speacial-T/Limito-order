server:
  port: 19096

spring:
  application:
    name: order-service
  data:
    redis:
      host: ${REDIS_URL:localhost}
      port: 6379
      database: 0
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/limito-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_URL:localhost}:19090/eureka

feign:
  resell-product-service:
    url: http://${RESELL_URL:localhost}:19095
  limited-product-service:
    url: http://${LIMITED_URL:localhost}:19094
  user-service:
    url: http://${USER_URL:localhost}:19092